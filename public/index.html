<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra Vertical - Quiniela en Vivo</title>
    <style>
        body { font-family: 'Segoe UI', Impact, Arial, sans-serif; background-color: #0f172a; margin: 0; padding: 10px; color: #ffffff; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .container { flex: 1; display: flex; flex-direction: column; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        h1 { text-align: center; color: #f59e0b; margin: 0 0 5px 0; font-size: 2.8rem; text-transform: uppercase; letter-spacing: 2px; }
        .fecha-actual { text-align: center; color: #94a3b8; margin-bottom: 20px; font-size: 1.3rem; font-weight: 500; }
        .bloque-horario { flex: 1; display: flex; flex-direction: column; }
        .horario-header { background: #ef4444; color: #ffffff; padding: 15px; font-size: 2.3rem; font-weight: bold; text-align: center; border-radius: 12px; text-transform: uppercase; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-bottom: 20px; }
        .loterias-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; flex: 1; }
        .columna-loteria { background: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 15px 10px; display: flex; flex-direction: column; }
        .loteria-titulo { font-size: 1.8rem; font-weight: bold; color: #38bdf8; text-align: center; border-bottom: 3px solid #38bdf8; padding-bottom: 10px; margin-bottom: 15px; text-transform: uppercase; }
        .numeros-lista { display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: space-around; }
        .numero-fila { display: flex; justify-content: space-between; align-items: center; background: #1e293b; border: 1px solid #334155; padding: 12px 15px; border-radius: 8px; }
        .posicion { font-size: 1.1rem; color: #94a3b8; font-weight: bold; }
        .valor { font-weight: bold; font-size: 1.9rem; color: #ffffff; font-family: monospace; }
        .cabeza { background: #22c55e; border-color: #4ade80; box-shadow: 0 0 15px rgba(34,197,94,0.4); }
        .cabeza .posicion { color: #ffffff; }
        .cabeza .valor { color: #ffffff; font-size: 2.4rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎰 Lotería Agencia</h1>
    <div class="fecha-actual" id="fechaText">Cargando extractos oficiales...</div>
    <div id="panelSorteos"></div>
</div>

<script>
    // MARCA DE REEMPLAZO: El servidor Express va a sobreescribir este comentario metiendo los números reales aquí dentro.
    /*INYECCION_DE_DATOS*/

    var TIEMPO_ACTUALIZACION = 60000; // Consultar nuevos sorteos al servidor cada 1 minuto
    var ordenTurnos = ['Previa', 'Primera', 'Matutina', 'Vespertina', 'Nocturna'];

    function mostrarSorteoVigente() {
        if (!datosGlobales || !datosGlobales.sorteos || datosGlobales.sorteos.length === 0) return;

        // Buscar el último sorteo disponible en orden cronológico
        var turnoVigente = datosGlobales.turnoVigente || null;
        if (!turnoVigente) {
            for (var i = 0; i < ordenTurnos.length; i++) {
                var candidato = ordenTurnos[i];
                for (var k = 0; k < datosGlobales.sorteos.length; k++) {
                    if (datosGlobales.sorteos[k].nombre === candidato) {
                        turnoVigente = candidato;
                    }
                }
            }
        }

        if (turnoVigente) {
            renderizarPizarra(datosGlobales, turnoVigente);
        }
    }

    function renderizarPizarra(data, turno) {
        document.getElementById('fechaText').innerText = 'Extractos Oficiales - Fecha: ' + data.fecha;
        var panel = document.getElementById('panelSorteos');
        panel.innerHTML = ''; 

        var sorteosDelHorario = [];
        for (var m = 0; m < data.sorteos.length; m++) {
            if (data.sorteos[m].nombre === turno) {
                sorteosDelHorario.push(data.sorteos[m]);
            }
        }

        var bloqueHorario = document.createElement('div');
        bloqueHorario.className = 'bloque-horario';

        var html = '<div class="horario-header">🔥 QUINIELA ' + turno.toUpperCase() + ' 🔥</div>' +
                   '<div class="loterias-grid">';

        for (var n = 0; n < sorteosDelHorario.length; n++) {
            var sorteoLoteria = sorteosDelHorario[n];
            html += '<div class="columna-loteria">' +
                    '<div class="loteria-titulo">' + sorteoLoteria.loteria + '</div>' +
                    '<div class="numeros-lista">';

            for (var i = 0; i < 10; i++) {
                var numeroImprimir = sorteoLoteria.numeros[i] || "----";
                
                if (numeroImprimir !== "----") {
                    while (numeroImprimir.length < 4) {
                        numeroImprimir = '0' + numeroImprimir;
                    }
                    if (i > 0) {
                        numeroImprimir = numeroImprimir.substring(1); 
                    }
                }

                html += '<div class="numero-fila ' + (i === 0 ? 'cabeza' : '') + '">' +
                        '<span class="posicion">' + (i + 1) + '°</span>' +
                        '<span class="valor">' + numeroImprimir + '</span>' +
                        '</div>';
            }

            html += '</div></div>';
        }

        html += '</div>'; 
        bloqueHorario.innerHTML = html;
        panel.appendChild(bloqueHorario);
    }

    async function actualizarDatosEnVivo() {
        try {
            var respuesta = await fetch('/api/datos');
            if (respuesta.ok) {
                var nuevosDatos = await respuesta.json();
                if (nuevosDatos && nuevosDatos.sorteos) {
                    datosGlobales = nuevosDatos;
                    mostrarSorteoVigente();
                }
            }
        } catch (err) {
            console.error('Error actualizando datos en vivo:', err);
        }
    }

    function iniciarEcosistema() {
        mostrarSorteoVigente();
        setInterval(actualizarDatosEnVivo, TIEMPO_ACTUALIZACION);
    }

    window.onload = iniciarEcosistema;
</script>

</body>
</html>
