<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra Vertical - Quiniela en Vivo</title>
    <style>
        /* Estilos optimizados para monitores verticales o tótems */
        body { 
            font-family: 'Segoe UI', Impact, Arial, sans-serif; 
            background-color: #0f172a; 
            margin: 0; 
            padding: 10px; 
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .container { 
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e293b; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        
        /* Encabezado Gigante */
        h1 { 
            text-align: center; 
            color: #f59e0b; 
            margin: 0 0 5px 0; 
            font-size: 2.8rem; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .fecha-actual { 
            text-align: center; 
            color: #94a3b8; 
            margin-bottom: 20px; 
            font-size: 1.3rem; 
            font-weight: 500; 
        }
        
        /* Contenedor del Sorteo Único en Pantalla */
        .bloque-horario { 
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .horario-header { 
            background: #ef4444; 
            color: #ffffff; 
            padding: 15px; 
            font-size: 2.3rem; 
            font-weight: bold; 
            text-align: center; 
            border-radius: 12px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        /* Grilla Vertical: 3 columnas (una para cada lotería) */
        .loterias-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            flex: 1;
        }

        .columna-loteria { 
            background: #0f172a; 
            border: 2px solid #334155; 
            border-radius: 12px; 
            padding: 15px 10px; 
            display: flex;
            flex-direction: column;
        }
        .loteria-titulo { 
            font-size: 1.8rem; 
            font-weight: bold; 
            color: #38bdf8; 
            text-align: center; 
            border-bottom: 3px solid #38bdf8; 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            text-transform: uppercase;
        }
        
        /* Lista de Premios del 1° al 10° */
        .numeros-lista { 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            flex: 1;
            justify-content: space-around; /* Distribuye los premios verticalmente */
        }
        .numero-fila { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 12px 15px; 
            border-radius: 8px; 
        }
        .posicion { 
            font-size: 1.1rem; 
            color: #94a3b8; 
            font-weight: bold; 
        }
        .valor { 
            font-weight: bold; 
            font-size: 1.9rem; 
            color: #ffffff; 
            font-family: monospace;
        }
        
        /* Resaltado especial para la Cabeza (1° Premio) */
        .cabeza { 
            background: #22c55e; 
            border-color: #4ade80; 
            box-shadow: 0 0 15px rgba(34,197,94,0.4);
        }
        .cabeza .posicion { color: #ffffff; }
        .cabeza .valor { color: #ffffff; font-size: 2.4rem; }
        
        .loading { text-align: center; font-size: 1.8rem; color: #94a3b8; padding: 40px; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎰 Lotería Agencia</h1>
    <div class="fecha-actual" id="fechaText">Sincronizando...</div>
    
    <div id="panelSorteos">
        <p class="loading">⏳ Cargando datos del servidor...</p>
    </div>
</div>

<script>
    // Usamos variables tradicionales (var) compatibles con cartelerías antiguas
    var API_URL = '/api/quiniela';
    var TIEMPO_API = 5 * 60 * 1000;    
    var TIEMPO_ROTACION = 15000;       
    
    var datosGlobales = null;
    var indiceTurnoActual = 0;
    var ordenTurnos = ['Previa', 'Primera', 'Matutina', 'Vespertina', 'Nocturna'];

    function consultarServidor() {
        console.log('🔄 Conectando con la API...');
        
        // Usamos XMLHttpRequest tradicional en lugar de fetch (máxima compatibilidad)
        var xhr = new XMLHttpRequest();
        xhr.open('GET', API_URL, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    datosGlobales = JSON.parse(xhr.responseText);
                    
                    var panel = document.getElementById('panelSorteos');
                    // Si la pantalla sigue vacía o cargando, arranca el ciclo
                    if (panel.innerHTML.indexOf('Cargando') !== -1 || panel.innerHTML === '') {
                        rotarSorteoVisual();
                    }
                } catch (e) {
                    console.error('Error al procesar JSON:', e);
                }
            }
        };
        xhr.send();
    }

    function rotarSorteoVisual() {
        if (!datosGlobales || !datosGlobales.sorteos) return;

        var turnoAMostrar = null;
        var intentos = 0;

        while (!turnoAMostrar && intentos < ordenTurnos.length) {
            var candidato = ordenTurnos[indiceTurnoActual];
            
            // Verificación tradicional de existencia de datos
            var tieneDatos = false;
            for (var k = 0; k < datosGlobales.sorteos.length; k++) {
                if (datosGlobales.sorteos[k].nombre === candidato) {
                    tieneDatos = true;
                    break;
                }
            }
            
            if (tieneDatos) {
                turnoAMostrar = candidato;
            } else {
                indiceTurnoActual = (indiceTurnoActual + 1) % ordenTurnos.length;
            }
            intentos++;
        }

        if (turnoAMostrar) {
            renderizarPizarra(datosGlobales, turnoAMostrar);
            indiceTurnoActual = (indiceTurnoActual + 1) % ordenTurnos.length;
        }
    }

    function renderizarPizarra(data, turno) {
        document.getElementById('fechaText').innerText = 'Extractos Oficiales - Hoy: ' + data.fecha;
        var panel = document.getElementById('panelSorteos');
        panel.innerHTML = ''; 

        // Filtrado manual compatible
        var sorteosDelHorario = [];
        for (var m = 0; m < data.sorteos.length; m++) {
            if (data.sorteos[m].nombre === turno) {
                sorteosDelHorario.push(data.sorteos[m]);
            }
        }

        var bloqueHorario = document.createElement('div');
        bloqueHorario.className = 'bloque-horario';

        var html = '<div class="horario-header">🔥 QUINIELA ' + turno.toUpperCase() + ' 🔥</div>' +
                   '<div class="loterias-grid">';

        for (var n = 0; n < sorteosDelHorario.length; n++) {
            var sorteoLoteria = sorteosDelHorario[n];
            html += '<div class="columna-loteria">' +
                    '<div class="loteria-titulo">' + sorteoLoteria.loteria + '</div>' +
                    '<div class="numeros-lista">';

            for (var i = 0; i < 10; i++) {
                var numeroImprimir = sorteoLoteria.numeros[i] || "----";
                
                if (numeroImprimir !== "----" && numeroImprimir.length < 4) {
                    // Relleno de ceros tradicional (padStart alternativo)
                    while (numeroImprimir.length < 4) {
                        numeroImprimir = '0' + numeroImprimir;
                    }
                }

                html += '<div class="numero-fila ' + (i === 0 ? 'cabeza' : '') + '">' +
                        '<span class="posicion">' + (i + 1) + '°</span>' +
                        '<span class="valor">' + numeroImprimir + '</span>' +
                        '</div>';
            }

            html += '</div></div>';
        }

        html += '</div>'; 
        bloqueHorario.innerHTML = html;
        panel.appendChild(bloqueHorario);
    }

    function iniciarEcosistema() {
        consultarServidor();
        setInterval(consultarServidor, TIEMPO_API);
        setInterval(rotarSorteoVisual, TIEMPO_ROTACION);
    }

    window.onload = iniciarEcosistema;
</script>

</body>
</html>
