<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra Oficial - Lotería de Santa Fe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Arial Narrow', Arial, Helvetica, sans-serif;
            background-color: #0b193d;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TABLERO GENERAL */
        .pizarra {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0082c8;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* ================= ENCABEZADO AZUL OSCURO ================= */
        .top-section {
            background: linear-gradient(180deg, #1b3582 0%, #24479e 100%);
            padding: 8px 14px 10px 14px;
            border-bottom: 3px solid #102254;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        /* Marca "Quiniela" + cartel de Turno */
        .brand-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .quiniela-logo {
            font-family: 'Trebuchet MS', 'Arial Black', sans-serif;
            font-style: italic;
            font-weight: 900;
            font-size: clamp(2.2rem, 5vh, 4.2rem);
            color: #f58426;
            letter-spacing: 1px;
            line-height: 1;
            text-shadow: 2px 3px 5px rgba(0, 0, 0, 0.45);
            margin-bottom: 4px;
        }

        .turno-holder {
            background: linear-gradient(180deg, #25509e 0%, #163675 55%, #1d438a 100%);
            border: 2px solid #3b6bc4;
            border-radius: 5px;
            padding: 3px 22px;
            box-shadow: inset 0 2px 6px rgba(255,255,255,0.25), 0 4px 8px rgba(0,0,0,0.45);
            min-width: 220px;
            text-align: center;
        }

        .turno-texto {
            font-family: 'Trebuchet MS', Impact, sans-serif;
            font-weight: 900;
            font-size: clamp(1.5rem, 3.2vh, 2.7rem);
            color: #f58426;
            letter-spacing: 4px;
            text-shadow: 1px 2px 3px rgba(0, 0, 0, 0.7);
            line-height: 1.1;
        }

        /* Sector "SORTEO DEL DIA" + 2 fichas de fecha */
        .sorteo-dia-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flecha-sorteo {
            background: #f8fafc;
            color: #1e293b;
            padding: 6px 24px 6px 12px;
            clip-path: polygon(0% 0%, 78% 0%, 100% 50%, 78% 100%, 0% 100%);
            font-weight: 900;
            font-size: clamp(0.85rem, 1.6vh, 1.35rem);
            line-height: 1.05;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .dia-fichas {
            display: flex;
            gap: 4px;
        }

        .ficha-dia {
            background: linear-gradient(180deg, #ffffff 0%, #e5e7eb 100%);
            color: #1e293b;
            font-family: Impact, 'Arial Narrow', sans-serif;
            font-size: clamp(2rem, 4.4vh, 3.6rem);
            font-weight: 900;
            width: clamp(36px, 5.2vw, 60px);
            height: clamp(46px, 5.5vh, 74px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #9ca3af;
            border-bottom: 3px solid #6b7280;
            border-radius: 2px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            line-height: 1;
        }

        /* Cabeceras blancas: POS | NACIONAL | PROVINCIA | SANTA FE */

            display: grid;
            grid-template-columns: 13% 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 2px;
        }

            font-weight: 900;
